<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond Strategy Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* VOICE: the poster come alive on a phone: festive, playful, still easy to use in a queue.
   IDEA: a holographic event ticket that prints out for you, tilts in your hand and gets stamped at the door.
   PICTURE: the ticket with its white QR panel; on sign-in, the poster title with a live countdown.
   COLOUR and TYPE: the poster's night-to-electric blue, cyan-lavender-pink gradient and four-point sparkle; Montserrat 800.
   LAYOUT: one 460px phone column on every screen, centred on a laptop. */
:root{color-scheme:dark;--ink:#f2f4ff;--mute:#b6bfea;--dim:#8f99cf;--card:rgba(12,24,104,.62);--line:rgba(170,185,255,.24);--ok:#3ff0b4;--cyan:#45f0e6;--bad:#ff8fab;--grad:linear-gradient(90deg,#45f0e6 0%,#8fb2ff 42%,#d58af5 72%,#f39bd6 100%);--chip:linear-gradient(90deg,#8af4ef,#c3c8ff 55%,#eab3f3)}
*{box-sizing:border-box;min-width:0}
html{background:#040a33}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(700px 520px at 100% -6%,rgba(47,107,255,.6),transparent 62%),radial-gradient(640px 520px at -20% 105%,rgba(196,92,240,.38),transparent 60%),linear-gradient(165deg,#040a33 0%,#0a1568 55%,#1430c4 100%)}
.sky>svg:first-child{position:absolute;inset:0;width:100%;height:100%}
.sky .spark{position:absolute;width:var(--s,22px);height:var(--s,22px);animation:tw 3.6s ease-in-out infinite,drift 14s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.08)}}
@keyframes drift{to{translate:var(--dx,12px) var(--dy,-24px)}}
.page{max-width:460px;margin:0 auto;padding:0 16px 34px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 0 14px}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-weight:500;letter-spacing:.32em;font-size:18px}
.wm small{font-size:8px;font-weight:600;letter-spacing:.5em;color:var(--mute);margin-top:5px}
.k{font-size:12px;font-weight:600;color:var(--mute)}
h1,h2{margin:0;line-height:1.15}
p{margin:0}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.shimmer{background:linear-gradient(90deg,#45f0e6,#8fb2ff,#d58af5,#f39bd6,#8fb2ff,#45f0e6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.stack{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card h2{font-size:17px;font-weight:800;margin-bottom:12px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:700 15px Montserrat,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--chip);border:0;color:#0a1462;font-weight:800;box-shadow:0 10px 30px rgba(120,190,255,.25)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite 1s}
@keyframes sweep{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn.white{background:#fff;color:#0a1462;border:0;font-weight:800}
.btn svg{width:22px;height:22px;flex:none}
.btn[disabled]{opacity:.6;pointer-events:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{display:block;text-align:center;font-weight:700;font-size:14px;color:var(--ink);padding:10px;text-decoration:underline;text-underline-offset:3px}
/* sign in */
.hero{text-align:center;padding:10px 0 2px;position:relative}
.hero .t{font-weight:800;line-height:.92;font-size:clamp(50px,15vw,68px)}
.hero .t span{display:block;animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.hero .t span.shimmer{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards,shim 6s linear infinite;animation-delay:var(--d,0s),0s}
.hero .s{font-weight:800;font-size:15px;margin-top:8px;letter-spacing:.03em;animation:rise .8s .35s cubic-bezier(.2,.8,.2,1) backwards}
.orbit{position:absolute;right:-6px;top:-8px;width:120px;pointer-events:none}
.orbit path{stroke-dasharray:330;stroke-dashoffset:330;animation:draw 1.6s .5s ease-out forwards}
.orbit use{transform-box:fill-box;transform-origin:center;animation:spin 1.2s .9s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{from{transform:scale(0) rotate(-180deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.cd{display:flex;gap:8px;justify-content:center;margin:18px 0 2px;animation:rise .8s .5s backwards}
.cd .u{min-width:64px;padding:8px 6px 6px;border-radius:16px;background:rgba(4,10,51,.55);border:1px solid var(--line);text-align:center}
.cd b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cd b.tick{animation:tick .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes tick{from{transform:translateY(-8px);opacity:.2}}
.cd small{font-size:11px;color:var(--mute);font-weight:600}
.cd .msg{padding:10px 16px;border-radius:999px;background:rgba(63,240,180,.14);color:#c9ffe9;font-weight:700;font-size:14px}
.cd.mini{justify-content:flex-start;margin:10px 0 0;gap:6px;animation:none}
.cd.mini .u{min-width:0;padding:5px 9px;border-radius:12px;display:flex;gap:4px;align-items:baseline}
.cd.mini b{font-size:15px;display:inline}
.cd.mini small{font-size:11px}
.login{animation:rise .8s .6s cubic-bezier(.2,.8,.2,1) backwards}
.login h1{font-size:21px;font-weight:800}
.login .lead{color:var(--mute);font-size:14px;margin:6px 0 16px}
.gis{display:flex;justify-content:center;min-height:44px}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--dim);font-size:13px;font-weight:600}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
input{width:100%;min-height:50px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(4,10,51,.6);color:var(--ink);font:16px Montserrat,sans-serif;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#8fb2ff;box-shadow:0 0 0 4px rgba(143,178,255,.18);outline:none}
input::placeholder{color:#7480bd}
.login form .btn{margin-top:10px}
.err{color:var(--bad);font-size:14px;font-weight:600;margin-top:10px;min-height:1.2em}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.hint{font-size:12px;color:var(--dim);margin-top:12px;text-align:center}
/* pass */
.hello h1{font-size:27px;font-weight:800;animation:rise .7s backwards}
.hello p{color:var(--mute);margin-top:6px;font-size:15px}
.ticket{position:relative;filter:drop-shadow(0 26px 44px rgba(0,0,0,.45));transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;animation:print 1s .1s cubic-bezier(.2,.8,.2,1) backwards}
.ticket.drag{transition:none}
@keyframes print{from{opacity:0;transform:perspective(900px) translateY(-40px) rotateX(24deg)}}
.t-top,.t-stub{padding:20px;position:relative}
.t-top::after,.t-stub::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:screen;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.2),transparent 42%),linear-gradient(115deg,transparent 30%,rgba(69,240,230,.16) 44%,rgba(243,155,214,.18) 56%,transparent 70%);background-size:100% 100%,260% 100%;animation:holo 6s ease-in-out infinite}
@keyframes holo{0%,100%{background-position:0 0,130% 0}50%{background-position:0 0,-30% 0}}
.t-top{background:linear-gradient(165deg,#1c33c2 0%,#0d1a78 80%);border-radius:24px 24px 0 0;-webkit-mask:radial-gradient(circle 15px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 15px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
.t-stub{background:linear-gradient(170deg,#0d1a78,#0a145e);border-radius:0 0 24px 24px;-webkit-mask:radial-gradient(circle 15px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 15px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
.t-stub::before{content:"";position:absolute;left:20px;right:20px;top:0;border-top:2px dashed rgba(170,185,255,.4)}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--chip);color:#0a1462;white-space:nowrap}
.t-name{font-weight:800;font-size:22px;line-height:1;margin-top:12px}
.t-sub{font-size:12px;font-weight:800;letter-spacing:.03em;margin-top:5px}
.qr{position:relative;z-index:2;display:block;background:#fff;border:0;border-radius:20px;padding:12px;margin:16px auto 4px;width:min(100%,270px);aspect-ratio:1;box-shadow:0 0 0 3px rgba(69,240,230,.35),0 0 46px rgba(69,240,230,.28);cursor:zoom-in}
.qr canvas{display:block;width:100%;height:100%;border-radius:8px}
.qr-hint{position:relative;z-index:2;text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-11deg);border:4px solid var(--ok);color:var(--ok);background:rgba(4,10,51,.92);font-weight:800;font-size:20px;line-height:1.15;padding:10px 16px;border-radius:14px;text-align:center;white-space:nowrap;animation:stampin .55s cubic-bezier(.2,1.6,.4,1) backwards}
.stamp small{display:block;font-size:12px;color:#c9ffe9}
@keyframes stampin{from{opacity:0;transform:translate(-50%,-50%) rotate(-30deg) scale(2.2)}}
.who{position:relative;z-index:2;font-size:24px;font-weight:800;line-height:1.15}
.who-sub{position:relative;z-index:2;color:var(--mute);font-size:14px;margin-top:3px}
.idrow{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.idrow small{display:block;font-size:11px;color:var(--dim);font-weight:600}
.code{font-weight:800;font-size:18px;letter-spacing:.07em;white-space:nowrap}
.status{position:relative;z-index:2;display:flex;gap:10px;align-items:center;margin-top:14px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);font-size:14px;font-weight:600}
.status.in{background:rgba(63,240,180,.14);color:#c9ffe9}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);flex:none;animation:pulse 1.8s infinite}
.status.in .dot{background:var(--ok);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(69,240,230,.6)}70%,100%{box-shadow:0 0 0 10px rgba(69,240,230,0)}}
.bring{position:relative;border-radius:22px;padding:2px;background:var(--grad);background-size:200% 100%;animation:shim 8s linear infinite;box-shadow:0 12px 40px rgba(213,138,245,.25)}
.bring>div{display:flex;gap:14px;align-items:flex-start;border-radius:20px;padding:16px;background:linear-gradient(160deg,#16248f,#0b1462)}
.bring svg{flex:none;width:44px;height:44px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.bring .lbl{display:inline-block;font-size:11px;font-weight:800;color:#0a1462;background:var(--chip);border-radius:999px;padding:2px 9px;margin-bottom:6px}
.bring b{display:block;font-size:17px;font-weight:800;line-height:1.25}
.bring p{font-size:14px;color:#d5dafa;margin-top:4px}
.chk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.chk-top h2{margin:0}
.bar2{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin:8px 0 4px;overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:6px;background:var(--grad);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.item{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 12px;margin-top:8px;border-radius:14px;border:1px solid var(--line);background:rgba(4,10,51,.4);color:var(--ink);font:600 15px Montserrat,sans-serif;text-align:left;cursor:pointer;transition:background .2s,border-color .2s}
.item small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.item .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #8fb2ff;display:grid;place-items:center;transition:background .2s,border-color .2s}
.item .box svg{width:16px;height:16px}
.item .box path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
.item[aria-checked=true]{border-color:rgba(63,240,180,.5);background:rgba(63,240,180,.08)}
.item[aria-checked=true] .box{background:var(--chip);border-color:transparent;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.item[aria-checked=true] .box path{stroke-dashoffset:0}
@keyframes pop{50%{transform:scale(1.25)}}
.r{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;font-weight:600}
.r:first-of-type{border-top:0;padding-top:0}
.r svg{width:22px;height:22px;stroke:var(--cyan);margin-top:1px}
.r small{display:block;color:var(--mute);font-size:13px;font-weight:500}
.agenda{list-style:none;margin:0;padding:0;position:relative}
.agenda::before{content:"";position:absolute;left:7px;top:8px;bottom:12px;width:2px;background:linear-gradient(#45f0e6,#d58af5);transform-origin:top;transform:scaleY(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.agenda li{position:relative;padding:0 0 13px 28px;font-size:15px;font-weight:700;opacity:0;transform:translateX(-10px);transition:opacity .5s,transform .5s;transition-delay:calc(var(--i)*90ms + .15s)}
.agenda li::before{content:"";position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:50%;background:#0b1670;border:3px solid #8fb2ff}
.agenda small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.in .agenda::before{transform:none}
.in .agenda li{opacity:1;transform:none}
.sp{display:flex;gap:12px;align-items:center;padding:8px;margin:0 -8px;border-radius:14px;transition:background .2s,transform .2s}
.sp:hover,.sp:active{background:rgba(255,255,255,.06);transform:translateX(4px)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:radial-gradient(circle at 30% 25%,#2b49e0,#0b1670);border:2px solid #8fb2ff}
.sp b{display:block;font-size:15px;line-height:1.2}
.sp span{display:block;font-size:13px;color:var(--mute)}
.note{font-size:13px;color:var(--dim)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
/* not found */
.nf-ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,198,92,.16);color:#ffc65c;font-size:26px;font-weight:800;margin-bottom:12px;animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.nf h1{font-size:22px;font-weight:800}
.nf .lead{color:var(--mute);font-size:15px;margin-top:6px}
.acct{margin-top:14px;padding:11px 13px;border-radius:14px;background:rgba(4,10,51,.55);border:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:16px}
.steps b{display:block;font-size:15px}
.steps p{font-size:14px;color:var(--mute);margin-top:3px}
.steps .btn{margin-top:10px}
.loading{padding:90px 0;text-align:center;color:var(--mute)}
.loading svg{width:46px;height:46px;display:block;margin:0 auto 14px;animation:spinstar 1.4s cubic-bezier(.5,0,.5,1) infinite}
@keyframes spinstar{50%{transform:rotate(180deg) scale(.7)}100%{transform:rotate(360deg)}}
.demo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;background:rgba(255,198,92,.12);border:1px solid rgba(255,198,92,.38);color:#ffe2a8;border-radius:14px;padding:10px 12px;margin-bottom:16px}
.demo a{color:#ffe2a8;font-weight:700}
footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--dim);display:grid;gap:6px}
footer a,footer button{color:var(--ink);font:700 13px Montserrat,sans-serif;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:rgba(2,6,35,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.ov .in{width:min(400px,100%);text-align:center;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.ov img{width:100%;border-radius:18px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ov p{color:var(--mute);font-size:14px;margin:12px 0}
.scanmode{background:#fff;color:#0a1462;backdrop-filter:none}
.scanmode .in{display:grid;gap:10px;justify-items:center}
.scanmode canvas{width:min(84vw,62vh,420px);height:min(84vw,62vh,420px);animation:zoomin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes zoomin{from{transform:scale(.6);opacity:0}}
.scanmode b{font-size:22px;font-weight:800}
.scanmode .code{color:#1636d8}
.scanmode p{color:#454d70;margin:0}
.scanmode .btn{background:#0a1462;color:#fff;border:0;max-width:260px}
.pv .in{background:linear-gradient(170deg,#0e1c86,#08115a);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:left}
.pv h3{margin:0;font-size:18px;font-weight:800}
.pv p{color:var(--mute);margin:6px 0 14px;font-size:14px}
.pv .btn{margin-top:8px}
.banner{position:fixed;left:50%;top:14px;z-index:45;transform:translateX(-50%);width:min(430px,calc(100% - 24px));padding:14px 18px;border-radius:18px;background:var(--chip);color:#0a1462;font-weight:800;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translate(-50%,-140%)}}
.tsp{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;z-index:46;animation:fly .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fly{to{transform:translate(var(--tx),var(--ty)) scale(.2) rotate(120deg);opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal,.agenda li{opacity:1;transform:none}.agenda::before{transform:none}.orbit path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <svg viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#45f0e6"/><stop offset=".5" stop-color="#8fb2ff"/><stop offset="1" stop-color="#f39bd6"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="10"/></filter></defs>
    <g fill="none" stroke="url(#sw)" stroke-linecap="round">
      <path d="M-40 640 C 90 630 200 730 300 900" stroke-width="28" opacity=".2" filter="url(#bl)"/>

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Please enter the email you registered with.');
    b.disabled = true; b.textContent = 'Finding your pass…'; err.textContent = '';
    try {
      const d = await server('getPassByEmail', email);
      if (!d.found) { b.disabled = false; b.textContent = 'Show my pass'; return fail(`We couldn't find ${d.email} on the confirmed list. Check the spelling, or use the email from your registration form.`); }
      S.mode = 'email'; store.set('bs26-pass-email', d.email); store.set('bs26-pass-mode', 'email'); show(d, true);

  });
}

function renderError(msg) {
  $('#app').innerHTML = `<section class="card nf login"><h1>Couldn't load your pass</h1><p class="lead">${esc(msg)}</p><p class="lead">Check your connection and try again. If it keeps happening, email ${esc(EVENT.contact)}.</p><button class="btn primary" style="margin-top:16px" data-act="retry">Try again</button></section>`;
}

function renderLoading(text) {
  $('#app').innerHTML = `<div class="loading">${STAR}${esc(text || 'Checking your registration…')}</div>`;
}

function renderFoot() {
  let who = '';
  if (S.data && S.data.found && S.mode === 'email') who = `<span>Signed in as ${esc(S.data.email)} · <button data-act="signout">Sign out</button></span>`;
  else if (S.data && S.mode === 'google' && !hasGAS() && !DEMO) who = `<span>Signed in with Google as ${esc(S.data.email)} · <button data-act="signout">Sign out</button></span>`;
  else if (S.data && S.mode === 'google') who = `<span>Signed in with Google as ${esc(S.data.email)} · ${S.googleUrl ? `<a href="${esc(chooserUrl())}" target="_top">Switch account</a>` : DEMO ? '<button data-act="gdemo">Switch account</button>' : ''} · <button data-act="useemail">Use email instead</button></span>`;
  $('#foot').innerHTML = who + `<span>Presented by MOKRA Consulting · ${esc(EVENT.contact)}</span>`;
}

function show(d, fresh) {
  S.data = d; S.email = d.email;
  if (d.found) renderPass(fresh); else renderNotFound();
  renderFoot();
  if (fresh && d.found && d.guest.checkedIn) setTimeout(confetti, 600);
}

/* ---------- start ---------- */
async function start() {
  renderLoading();
  try {
    const me = await server('getMyPass');
    S.googleUrl = /^https:\/\//.test(me.googleUrl || '') ? me.googleUrl : '';
    if (me.email) { S.mode = 'google'; return show(me, true); }
    const saved = store.get('bs26-pass-email');
    if (saved) {
      try { const d = await server('getPassByEmail', saved); if (d.found) { S.mode = store.get('bs26-pass-mode') === 'google' ? 'google' : 'email'; return show(d, false); } } catch (e) {}
      store.del('bs26-pass-email'); store.del('bs26-pass-mode');
    }
    S.mode = 'none'; S.data = null; renderLogin(); renderFoot();
  } catch (e) { renderError(e.message); renderFoot(); }
}

/* live update once scanned */
async function poll() {
  const d0 = S.data;
  if (!d0 || !d0.found || d0.guest.checkedIn || document.visibilityState !== 'visible') return;
  try {
    const d = (S.mode === 'google' && hasGAS()) ? await server('getMyPass') : await server('getPassByEmail', S.email);
    if (d.found && d.guest.checkedIn) {
      S.data = d;
      const st = $('#st'); if (st) st.outerHTML = statusHTML(d.guest);
      const sl = $('#stampSlot'); if (sl) sl.innerHTML = stampHTML(d.guest);
      if (!$('#ov').hidden && $('#ov').classList.contains('scanmode')) closeOv();
      confetti(); vibrate([80, 60, 160]); banner(`Welcome to Beyond Strategy, ${firstName(d.guest.name)}!`);
    }
  } catch (e) {}
}
setInterval(poll, 15000);
document.addEventListener('visibilitychange', poll);

/* ---------- overlays ---------- */
let wake = null;
function closeOv() { const ov = $('#ov'); ov.hidden = true; ov.innerHTML = ''; ov.className = 'ov'; try { wake && wake.release(); } catch (e) {} wake = null; }
async function scanMode() {
  const g = S.data.guest, ov = $('#ov'); ov.className = 'ov scanmode';
  ov.innerHTML = `<div class="in" role="dialog" aria-label="Your QR code"><canvas id="bigqr"></canvas><b>${esc(g.name)}</b><span class="code">${esc(g.id)}</span><p>Turn your screen brightness up and hold the phone steady.</p><button class="btn" data-act="closeov">Done</button></div>`;
  ov.hidden = false;
  const c = $('#bigqr'); paintQR(c.getContext('2d'), g.id, 0, 0, sizeCanvas(c, 320));
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
async function passImage() {
  try { await document.fonts.ready; } catch (e) {}
  const g = S.data.guest, W = 1080, H = 1640, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const bg = x.createLinearGradient(0, 0, W * .5, H); bg.addColorStop(0, '#040a33'); bg.addColorStop(.6, '#0b1670'); bg.addColorStop(1, '#1430c4'); x.fillStyle = bg; x.fillRect(0, 0, W, H);
  const glow = (cx, cy, r, col) => { const gr = x.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); };
  glow(W, 0, 700, 'rgba(47,107,255,.55)'); glow(0, H, 700, 'rgba(196,92,240,.35)');
  const tg = x.createLinearGradient(140, 0, 940, 0); tg.addColorStop(0, '#45f0e6'); tg.addColorStop(.42, '#8fb2ff'); tg.addColorStop(.72, '#d58af5'); tg.addColorStop(1, '#f39bd6');
  x.textAlign = 'center'; x.fillStyle = '#b6bfea'; x.font = '600 30px Montserrat, sans-serif'; x.fillText('MOKRA Consulting presents', W / 2, 120);
  x.fillStyle = '#fff'; x.font = '800 128px Montserrat, sans-serif'; x.fillText('BEYOND', W / 2, 260);
  x.fillStyle = tg; x.fillText('STRATEGY', W / 2, 385);
  x.fillStyle = '#fff'; x.font = '800 42px Montserrat, sans-serif'; x.fillText('CONSULTING & CAREER LAB', W / 2, 455);
  const qs = 560, qx = (W - qs) / 2, qy = 525;
  x.save(); x.shadowColor = 'rgba(69,240,230,.5)'; x.shadowBlur = 60; x.fillStyle = '#fff'; rr(x, qx - 24, qy - 24, qs + 48, qs + 48, 40); x.fill(); x.restore();
  paintQR(x, g.id, qx, qy, qs);
  x.fillStyle = '#fff'; x.font = '800 62px Montserrat, sans-serif'; x.fillText(String(g.name || '').slice(0, 28), W / 2, 1225);
  x.fillStyle = '#b6bfea'; x.font = '600 30px Montserrat, sans-serif'; x.fillText(String(g.university || '').slice(0, 52), W / 2, 1275);
  x.fillStyle = tg; x.font = '800 40px Montserrat, sans-serif'; x.fillText(g.id, W / 2, 1340);
  x.fillStyle = '#dfe4ff'; x.font = '600 28px Montserrat, sans-serif'; x.fillText(EVENT.date + ' · ' + EVENT.time, W / 2, 1405); x.fillText(EVENT.place + ', SWU Services Building', W / 2, 1447);
  x.fillStyle = 'rgba(255,255,255,.1)'; rr(x, 190, 1500, 700, 80, 40); x.fill();
  x.fillStyle = '#fff'; x.font = '700 30px Montserrat, sans-serif'; x.fillText('Bring your own laptop or tablet', W / 2, 1551);
  return c.toDataURL('image/png');
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-pick],[data-pack]');
  if (!t) { if (e.target.id === 'ov') closeOv(); return; }
  if (t.dataset.pick) { S.demoGoogle = t.dataset.pick; closeOv(); renderLoading('Checking your registration…'); try { const d = await server('getMyPass'); S.mode = 'google'; show(d, true); } catch (er) { renderError(er.message); } return; }
  if (t.dataset.pack) {
    const k = t.dataset.pack, done = Object.assign({ pass: true }, store.get(packKey()) || {});
    done[k] = !done[k]; store.set(packKey(), done);
    t.setAttribute('aria-checked', String(done[k]));
    const n = PACK.filter(p => done[p[0]]).length;
    $('#pk').textContent = n + ' of ' + PACK.length + ' ready'; $('#pkbar').style.width = (n / PACK.length * 100) + '%';
    if (done[k]) { const r = t.querySelector('.box').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 7); vibrate(20); }
    if (n === PACK.length && done[k]) { confetti(); banner("You're all packed. See you on the 12th!"); }
    return;
  }
  switch (t.dataset.act) {
    case 'retry': return start();
    case 'gdemo': return openChooser();
    case 'gonav': setTimeout(() => renderLoading('Opening Google sign-in…'), 80); return;
    case 'useemail': S.mode = 'none'; S.data = null; renderLogin(); renderFoot(); setTimeout(() => { const i = $('#em'); i && i.focus(); }, 50); return;
    case 'signout': store.del('bs26-pass-email'); store.del('bs26-pass-mode'); try { if (gisReady) google.accounts.id.disableAutoSelect(); } catch (er) {} S.mode = 'none'; S.data = null; renderLogin(); renderFoot(); return;
    case 'bigqr': return scanMode();
    case 'closeov': return closeOv();
    case 'saveimg': { const url = await passImage(), ov = $('#ov'); ov.className = 'ov';
      ov.innerHTML = `<div class="in"><img src="${url}" alt="Your entry pass"><p>Press and hold the image to save it to your photos, or take a screenshot.</p><div class="two"><a class="btn primary" href="${url}" download="beyond-strategy-pass.png">Download</a><button class="btn" data-act="closeov">Close</button></div></div>`;
      ov.hidden = false; return; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeOv(); });

start();
})();
